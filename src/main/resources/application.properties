spring.application.name=HeThongMuaSamNoiBo

# Cổng chạy Spring Boot (mặc định 8080)
server.port=8080

# Cấu hình kết nối MySQL mặc định XAMPP (Cổng 3306, user root, không mật khẩu)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/he_thong_mua_sam_noi_bo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
dev
# Cấu hình Hibernate (Tự động cập nhật bảng theo Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hỗ trợ hiển thị UTF-8 tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
